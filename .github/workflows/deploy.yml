# ---------------------------------------------------------------------------
#  CI/CD pipeline — build, verify, and deploy to AWS using GitHub OIDC.
#
#  This is the deployment pipeline shown in the project's architecture diagram,
#  expressed as real code. It authenticates to AWS with a short-lived OpenID
#  Connect (OIDC) token — no long-lived AWS keys are stored in the repository.
#
#  It runs on-demand for now (workflow_dispatch). Once the AWS infrastructure
#  from infra/terraform is provisioned, uncomment the `push` trigger below and
#  set the repository secret AWS_DEPLOY_ROLE_ARN and variable AMPLIFY_APP_ID.
# ---------------------------------------------------------------------------
name: Deploy to AWS

on:
  workflow_dispatch:
  # push:
  #   branches: [master]

permissions:
  contents: read
  id-token: write # REQUIRED for GitHub OIDC → AWS STS

env:
  AWS_REGION: eu-central-1

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build (verify production bundle)
        run: npm run build
        env:
          # Placeholder values so the production build compiles without a live
          # database or real secret (the build does not connect to the DB).
          DATABASE_URL: postgresql://user:password@localhost:5432/db
          AUTH_SECRET: build-time-placeholder-not-a-real-secret
          AUTH_TRUST_HOST: "true"

  deploy:
    name: Deploy via OIDC → Amplify
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (assume role via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger Amplify release deployment
        run: |
          aws amplify start-job \
            --app-id "${{ vars.AMPLIFY_APP_ID }}" \
            --branch-name master \
            --job-type RELEASE
